name: Build Rust idevice-ffi for iOS

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-rust-idevice.yml'

jobs:
  build-rust:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout PaxStore
        uses: actions/checkout@v4
        with:
          path: paxstore
          persist-credentials: true

      - name: Checkout jkcoxson/idevice
        uses: actions/checkout@v4
        with:
          repository: jkcoxson/idevice
          path: idevice-src
          
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
          
      - name: Build idevice-ffi for iOS
        run: |
          cd idevice-src
          BINDGEN_EXTRA_CLANG_ARGS="--sysroot=$(xcrun --sdk iphoneos --show-sdk-path)" \
          IPHONEOS_DEPLOYMENT_TARGET=15.0 \
          cargo build -p idevice-ffi --release --target aarch64-apple-ios
          ls -lh target/aarch64-apple-ios/release/*.a
          
      - name: Create xcframework
        run: |
          mkdir -p build/IDeviceFFI.xcframework/ios-arm64
          cp idevice-src/target/aarch64-apple-ios/release/libidevice_ffi.a build/IDeviceFFI.xcframework/ios-arm64/
          mkdir -p build/IDeviceFFI.xcframework/ios-arm64/Headers
          echo "// placeholder - use Libraries/IDeviceFFI-headers/idevice.h" > build/IDeviceFFI.xcframework/ios-arm64/Headers/idevice.h
          cat > build/IDeviceFFI.xcframework/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>AvailableLibraries</key>
            <array>
              <dict>
                <key>BinaryPath</key>
                <string>libidevice_ffi.a</string>
                <key>HeadersPath</key>
                <string>Headers</string>
                <key>LibraryIdentifier</key>
                <string>ios-arm64</string>
                <key>LibraryPath</key>
                <string>libidevice_ffi.a</string>
                <key>SupportedArchitectures</key>
                <array><string>arm64</string></array>
                <key>SupportedPlatform</key>
                <string>ios</string>
              </dict>
            </array>
            <key>CFBundlePackageType</key>
            <string>XFWK</string>
            <key>XCFrameworkFormatVersion</key>
            <string>1.0</string>
          </dict>
          </plist>
          PLIST
          echo "xcframework created:"
          find build/IDeviceFFI.xcframework -type f
          
      - name: Upload xcframework
        uses: actions/upload-artifact@v4
        with:
          name: IDeviceFFI-xcframework
          path: build/IDeviceFFI.xcframework

      - name: Commit xcframework to repo
        working-directory: paxstore
        run: |
          rm -rf Libraries/IDeviceFFI.xcframework
          mkdir -p Libraries
          cp -r ../build/IDeviceFFI.xcframework Libraries/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Libraries/IDeviceFFI.xcframework
          git commit -m "更新 IDeviceFFI.xcframework（jkcoxson/idevice 官方源，含 tunnel_create_usb）" || echo "無變更"
          git push
