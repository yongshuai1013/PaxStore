name: Build Rust idevice-ffi for iOS

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-rust-idevice.yml'

jobs:
  build-rust:
    runs-on: macos-latest
    steps:
      - name: Checkout idevice
        uses: actions/checkout@v4
        with:
          repository: jkcoxson/idevice
          path: idevice
          
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
          
      - name: Build idevice-ffi for iOS
        run: |
          cd idevice/ffi
          BINDGEN_EXTRA_CLANG_ARGS="--sysroot=$(xcrun --sdk iphoneos --show-sdk-path)" \
          IPHONEOS_DEPLOYMENT_TARGET=15.0 \
          cargo build --release --target aarch64-apple-ios \
            --no-default-features \
            --features "afc,tcp,installation_proxy,aws-lc,pairing_file,lockdown"
          # 找生成的靜態庫和頭文件
          ls -lh ../../target/aarch64-apple-ios/release/libidevice_ffi.a
          find ../../target/aarch64-apple-ios/release -name "idevice.h" | head -5
          
      - name: Create xcframework
        run: |
          mkdir -p build/IDeviceFFI.xcframework/ios-arm64
          cp idevice/target/aarch64-apple-ios/release/libidevice_ffi.a build/IDeviceFFI.xcframework/ios-arm64/
          # 找頭文件（cbindgen 生成的）
          HEADER=$(find idevice/target/aarch64-apple-ios/release -name "idevice.h" | head -1)
          mkdir -p build/IDeviceFFI.xcframework/ios-arm64/Headers
          cp "$HEADER" build/IDeviceFFI.xcframework/ios-arm64/Headers/
          # 寫 Info.plist
          cat > build/IDeviceFFI.xcframework/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>AvailableLibraries</key>
            <array>
              <dict>
                <key>BinaryPath</key>
                <string>libidevice_ffi.a</string>
                <key>HeadersPath</key>
                <string>Headers</string>
                <key>LibraryIdentifier</key>
                <string>ios-arm64</string>
                <key>LibraryPath</key>
                <string>libidevice_ffi.a</string>
                <key>SupportedArchitectures</key>
                <array><string>arm64</string></array>
                <key>SupportedPlatform</key>
                <string>ios</string>
              </dict>
            </array>
            <key>CFBundlePackageType</key>
            <string>XFWK</string>
            <key>XCFrameworkFormatVersion</key>
            <string>1.0</string>
          </dict>
          </plist>
          PLIST
          echo "xcframework created:"
          find build/IDeviceFFI.xcframework -type f
          
      - name: Upload xcframework
        uses: actions/upload-artifact@v4
        with:
          name: IDeviceFFI-xcframework
          path: build/IDeviceFFI.xcframework
