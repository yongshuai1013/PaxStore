name: Build PaxStore

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install XcodeGen
        run: brew install xcodegen
        
      - name: Generate project
        run: xcodegen generate
        
      - name: Build (unsigned)
        run: |
          xcodebuild archive \
            -scheme PaxStore \
            -destination 'generic/platform=iOS' \
            -archivePath build/PaxStore.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
          
      - name: Export IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/PaxStore.xcarchive/Products/Applications/PaxStore.app build/ipa/Payload/
          cd build/ipa && zip -r ../PaxStore-unsigned.ipa Payload
          
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PaxStore-unsigned
          path: build/PaxStore-unsigned.ipa
