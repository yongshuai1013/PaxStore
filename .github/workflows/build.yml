name: Build PaxStore

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Download IDeviceFFI xcframework
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 找最近一次成功的 Rust 構建
          RUN_ID=$(gh api repos/yongshuai1013/PaxStore/actions/workflows/build-rust-idevice.yml/runs --jq '.workflow_runs[] | select(.conclusion=="success") | .id' | head -1)
          echo "Using Rust build run: $RUN_ID"
          ART_ID=$(gh api repos/yongshuai1013/PaxStore/actions/runs/$RUN_ID/artifacts --jq '.artifacts[] | select(.name=="IDeviceFFI-xcframework") | .id')
          mkdir -p /tmp/idevice_dl
          gh api repos/yongshuai1013/PaxStore/actions/artifacts/$ART_ID/zip > /tmp/idevice_dl/xcf.zip
          mkdir -p Libraries
          unzip -q -o /tmp/idevice_dl/xcf.zip -d Libraries/IDeviceFFI.xcframework
          ls -lh Libraries/IDeviceFFI.xcframework/ios-arm64/
          
      - name: Install XcodeGen
        run: brew install xcodegen
        
      - name: Generate project
        run: xcodegen generate
        
      - name: Build (unsigned)
        run: |
          xcodebuild archive \
            -scheme PaxStore \
            -destination 'generic/platform=iOS' \
            -archivePath build/PaxStore.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
          
      - name: Export IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/PaxStore.xcarchive/Products/Applications/PaxStore.app build/ipa/Payload/
          cd build/ipa && zip -r ../PaxStore-unsigned.ipa Payload
          
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PaxStore-unsigned
          path: build/PaxStore-unsigned.ipa
