name: PaxStore

options:
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.19
  SideSign:
    url: https://github.com/yongshuai1013/SideSign.git
    revision: da194c60f5366394fb715354391952dd9ca89ac4
  CodeSignKit:
    url: https://github.com/mahee96/CodeSignKit.git
    branch: main

targets:
  PaxStore:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - Sources/PaxStore
    dependencies:
      - package: SideSign
      - package: CodeSignKit
      - package: ZIPFoundation
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.paxstore.app
      PRODUCT_NAME: PaxStore
    info:
      path: Resources/Info.plist
