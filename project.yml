name: PaxStore

options:
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.19
  swift-nio-ssl:
    url: https://github.com/apple/swift-nio-ssl.git
    from: 2.0.0
  swift-nio:
    url: https://github.com/apple/swift-nio.git
    from: 2.0.0
  SideSign:
    url: https://github.com/yongshuai1013/SideSign.git
    revision: da194c60f5366394fb715354391952dd9ca89ac4
  CodeSignKit:
    url: https://github.com/mahee96/CodeSignKit.git
    branch: main
  EMProxyPkg:
    path: Packages/EMProxy
  GCDWebServer:
    url: https://github.com/swisspol/GCDWebServer.git
    from: 3.7.0

targets:
  PaxStore:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - Sources/PaxStore
    resources:
      - Sources/PaxStore/Resources/ios-sign.p12
      - Sources/PaxStore/Resources/silence.wav
      - Sources/PaxStore/Assets.xcassets
    dependencies:
      - package: SideSign
      - package: CodeSignKit
      - package: ZIPFoundation
      - package: EMProxyPkg
        product: EMProxy
      - package: swift-nio-ssl
        product: NIOSSL
      - package: swift-nio
        product: NIO
      - package: swift-nio
        product: NIOHTTP1
      - package: GCDWebServer
      - framework: Libraries/IDeviceFFI.xcframework
        embed: false
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.paxstore.app
      SWIFT_OBJC_BRIDGING_HEADER: Sources/PaxStore/PaxStore-Bridging-Header.h
      PRODUCT_NAME: PaxStore
    info:
      path: Resources/Info.plist
